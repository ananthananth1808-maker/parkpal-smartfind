<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- App Title -->
    <title>ParkPal SmartFind - Smart Parking Finder</title>

    <!-- SEO Description -->
    <meta 
      name="description" 
      content="ParkPal SmartFind helps you quickly find nearby parking spaces, save time, and avoid traffic hassle. Smart, fast, and reliable parking solution." 
    />

    <!-- Author -->
    <meta name="author" content="Ananth A,Abishek Pushparaj M" />

    <!-- Keywords (optional but useful) -->
    <meta 
      name="keywords" 
      content="parking app, smart parking, parking finder, Chennai parking, car parking app, ParkPal" 
    />

    <!-- Open Graph (for WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:title" content="ParkPal SmartFind - Smart Parking Finder" />
    <meta 
      property="og:description" 
      content="Find parking spaces easily with ParkPal SmartFind. Save time and park smarter!" 
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourwebsite.com" />
    <meta 
      property="og:image" 
      content="https://yourwebsite.com/preview-image.png" 
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ParkPal SmartFind" />
    <meta 
      name="twitter:description" 
      content="Smart way to find parking spaces instantly 🚗" 
    />
    <meta 
      name="twitter:image" 
      content="https://yourwebsite.com/preview-image.png" 
    />

    <!-- Favicon -->
    <link rel="icon" href="Smart parking in modern garage.png" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
